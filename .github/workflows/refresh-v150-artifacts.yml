name: Refresh Pamet 1.5.0 artifacts

on:
  push:
    branches: [feature/pamet-v1.5.0-insights-design-system]
    paths: ['.github/workflows/refresh-v150-artifacts.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pamet-v1.5.0-insights-design-system
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Normalize 1.5.0 source and release assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements={
            'index.html': [('Doctor Report','Visit Brief'),('Email doctor','Email visit brief')],
            'js/store.js': [('Doctor report (PDF)','Visit Brief (PDF)')],
            'scripts/check-production.js': [("sw.js?v=1400","sw.js?v=1500"),('Pamet 1.4.0','Pamet 1.5.0')]
          }
          for name,pairs in replacements.items():
            p=Path(name); s=p.read_text()
            for old,new in pairs: s=s.replace(old,new)
            p.write_text(s)
          PY
      - name: Regenerate lockfile and production bundles
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm run build
          npm run check
          npm test
          npm audit --omit=dev --audit-level=high
      - name: Commit generated release artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json dist/pamet.min.js dist/pamet.min.css index.html js/store.js scripts/check-production.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build: refresh Pamet 1.5.0 release artifacts'
          git push origin HEAD:feature/pamet-v1.5.0-insights-design-system
