name: One-time source cleanup

on:
  push:
    branches: [chore/oauth-production-readiness]

permissions:
  contents: write

jobs:
  stamp-source-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Replace stale source cache/version markers
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = require('./package.json').version;
          const asset = version.replace(/\D/g, '') || 'current';
          const file = 'index.html';
          let html = fs.readFileSync(file, 'utf8');
          html = html
            .replace(/dist\/pamet\.min\.css\?v=\d+/g, `dist/pamet.min.css?v=${asset}`)
            .replace(/dist\/pamet\.min\.js\?v=\d+/g, `dist/pamet.min.js?v=${asset}`)
            .replace(/assets\/pamet-mark\.svg\?v=\d+/g, `assets/pamet-mark.svg?v=${asset}`)
            .replace(/data-pamet-brand-v\d+/g, `data-pamet-brand-release="${version}"`)
            .replace(/data-pamet-v\d+/g, `data-pamet-release="${version}"`);
          fs.writeFileSync(file, html);
          NODE
      - name: Commit source normalization
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html is already normalized."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m "Normalize source asset version markers"
          git push origin HEAD:chore/oauth-production-readiness
