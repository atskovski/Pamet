name: Fix UI navigation waits

on:
  push:
    branches: [test/ui-integrity-gate]
    paths:
      - .github/workflows/fix-ui-navigation-waits.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test/ui-integrity-gate
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Make browser navigation deterministic
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'tests/e2e/ui-integrity.spec.js';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replaceAll("page.goto('/')", "page.goto('/', { waitUntil: 'domcontentloaded' })");
          fs.writeFileSync(path, source);
          NODE
          node --check tests/e2e/ui-integrity.spec.js
          rm .github/workflows/fix-ui-navigation-waits.yml
      - name: Commit navigation wait fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/ui-integrity.spec.js .github/workflows/fix-ui-navigation-waits.yml
          git commit -m 'Make UI navigation waits deterministic'
          git push origin HEAD:test/ui-integrity-gate
