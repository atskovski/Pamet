name: Pamet v1.6.8 governance prep

on:
  push:
    branches:
      - fix/pamet-v1.6.8-insights-completeness

permissions:
  contents: write

jobs:
  governance-prep:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/pamet-v1.6.8-insights-completeness
          fetch-depth: 0
      - name: Align release-facing governance records
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const replace = (file, from, to) => {
            let text = fs.readFileSync(file, 'utf8');
            if (!text.includes(from)) throw new Error(`${file}: missing expected text: ${from}`);
            text = text.replace(from, to);
            fs.writeFileSync(file, text);
          };
          replace(
            'THREAT_MODEL.md',
            'Current reviewed application release: **v1.6.6**.',
            'Current application release: **v1.6.8**. Threat-model assurance remains inherited from the v1.6.6 review baseline; this patch does not claim a new independent review.'
          );
          replace(
            'GO_LIVE_STATUS.md',
            '# Pamet 1.6.6 — Go-Live Status at a Glance',
            '# Pamet 1.6.8 — Go-Live Status at a Glance'
          );
          replace(
            'PRODUCTION_READINESS.md',
            '# Pamet v1.6.6 Production Readiness Review',
            '# Pamet v1.6.8 Production Readiness Review'
          );
          replace(
            'REAL_ENVIRONMENT_ACCEPTANCE.md',
            'Expected repository release: **1.6.6**',
            'Expected repository release: **1.6.8**'
          );
          NODE
          rm .github/workflows/pamet-v1.6.8-governance-prep.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align v1.6.8 governance release headers"
          git push origin HEAD:fix/pamet-v1.6.8-insights-completeness
