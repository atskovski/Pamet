name: Mobile release coordination

on:
  push:
    branches: [main]
    paths:
      - 'contracts/mobile-api.json'
      - 'package.json'
      - 'server.js'
      - 'secure-server.js'
      - 'lib/**'
      - 'db/**'
      - 'js/**'
      - 'css/**'
      - 'README.md'
      - 'THREAT_MODEL.md'
      - 'PRODUCTION_READINESS.md'
      - 'GO_LIVE_STATUS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate production mobile contract
        run: |
          test -f contracts/mobile-api.json
          test "$(jq -r .backendVersion contracts/mobile-api.json)" = "$(node -p "require('./package.json').version")"
          test "$(jq -r .contractVersion contracts/mobile-api.json)" -ge 2

  dispatch-native:
    needs: validate-contract
    runs-on: ubuntu-latest
    env:
      MOBILE_SYNC_TOKEN: ${{ secrets.MOBILE_SYNC_TOKEN }}
    steps:
      - name: Dispatch iOS and Android release checks when configured
        if: ${{ env.MOBILE_SYNC_TOKEN != '' }}
        run: |
          payload=$(jq -n --arg sha "${GITHUB_SHA}" --arg version "${GITHUB_REF_NAME}" '{event_type:"pamet-production-updated",client_payload:{production_sha:$sha,source_ref:$version}}')
          for repo in Pamet-iOS Pamet-Android; do
            curl --fail --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${MOBILE_SYNC_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/atskovski/${repo}/dispatches" \
              -d "$payload"
          done
      - name: Explain optional cross-repository dispatch
        if: ${{ env.MOBILE_SYNC_TOKEN == '' }}
        run: echo 'MOBILE_SYNC_TOKEN is not configured; native repositories will still detect contract drift on their scheduled checks.'
