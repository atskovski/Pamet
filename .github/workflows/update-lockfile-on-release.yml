name: Update release lockfile

on:
  push:
    branches:
      - fix/v1.6.1-cache-version-dark-mode
    paths:
      - package.json
      - .github/workflows/update-lockfile-on-release.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/v1.6.1-cache-version-dark-mode
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit synchronized lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Sync package-lock metadata for Pamet 1.6.1'
          git push origin HEAD:fix/v1.6.1-cache-version-dark-mode
