name: One-time Stripe live diagnostic

on:
  push:
    branches: [fix/stripe-webhook-live-readiness]

permissions:
  contents: read

jobs:
  live-stripe-diagnostic:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Check production including Stripe webhook configuration
        env:
          PAMET_BASE_URL: https://pamet.wasmer.app
        run: node scripts/check-live-environment.js
