name: Prepare Pamet v1.6.4 release artifacts

on:
  push:
    branches:
      - release/production-hardening-v1.6.4
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pamet-v1.6.4-release-prep
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/production-hardening-v1.6.4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Synchronize release metadata
        run: node scripts/prepare-release.js
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build strict-CSP production bundles
        run: npm run build
      - name: Run release checks
        run: npm run check
      - name: Run unit/security tests
        run: npm run test:unit
      - name: Commit generated release artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json CHANGELOG.md README.md js/plan-catalog.generated.js dist/pamet.min.js dist/pamet.min.css
          if git diff --cached --quiet; then
            echo 'Release artifacts already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[release] Synchronize Pamet 1.6.4 generated artifacts'
          git push origin HEAD:release/production-hardening-v1.6.4
