name: Pamet Stripe entitlement reconciliation

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile Stripe subscriptions with Pamet entitlements
        env:
          PAMET_CRON_SECRET: ${{ secrets.PAMET_CRON_SECRET }}
        run: |
          if [ -z "$PAMET_CRON_SECRET" ]; then
            echo "::error::PAMET_CRON_SECRET is not configured in GitHub Actions secrets."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            -X POST "https://pamet.wasmer.app/api/jobs/stripe-reconcile" \
            -H "Authorization: Bearer $PAMET_CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data '{}'
