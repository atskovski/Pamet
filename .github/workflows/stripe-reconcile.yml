name: Pamet Stripe entitlement reconciliation

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile Stripe subscriptions with Pamet entitlements
        run: |
          set -euo pipefail
          OIDC_RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pamet-production-jobs")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          test -n "$OIDC_TOKEN"
          echo "::add-mask::$OIDC_TOKEN"
          curl --fail-with-body --silent --show-error \
            -X POST "https://pamet.wasmer.app/api/jobs/stripe-reconcile" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{}'
