name: Refresh Pamet 1.4.0 artifacts

on:
  push:
    branches: [feature/pamet-v1.4.0-product-clarity-reminders]
    paths: ['.github/workflows/refresh-v140-artifacts.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pamet-v1.4.0-product-clarity-reminders
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Normalize release assertions and product clarity guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/check-production.js')
          s=p.read_text()
          s=s.replace("sw.js?v=1300", "sw.js?v=1400").replace("Pamet 1.3.0", "Pamet 1.4.0")
          p.write_text(s)
          for name in ['scripts/check-production-ui.js']:
              p=Path(name)
              if p.exists():
                  s=p.read_text().replace('version-update-v1.3.0.js','version-update.js').replace('sw.js?v=1300','sw.js?v=1400').replace('pamet-shell-v130-0','pamet-shell-v140-0')
                  p.write_text(s)
          p=Path('js/product-clarity-v1.4.0.js')
          s=p.read_text()
          needle="    const emerging = patterns.filter((pattern) => pattern.isEmerging);\n"
          insert=needle+"    const signature = [days, confirmed.length, emerging.length, confirmed[0]?.title || ''].join('|');\n    if (banner.dataset.readinessSignature === signature) return;\n"
          if 'readinessSignature === signature' not in s:
              s=s.replace(needle,insert)
              s=s.replace("    banner.classList.add('pattern-readiness-banner');", "    banner.dataset.readinessSignature = signature;\n    banner.classList.add('pattern-readiness-banner');")
          p.write_text(s)
          PY
      - name: Regenerate lockfile and production bundles
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm run build
          npm run check
          npm test
          npm audit --omit=dev --audit-level=high
      - name: Commit generated release artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json dist/pamet.min.js dist/pamet.min.css scripts/check-production.js scripts/check-production-ui.js js/product-clarity-v1.4.0.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build: refresh Pamet 1.4.0 release artifacts'
          git push origin HEAD:feature/pamet-v1.4.0-product-clarity-reminders
