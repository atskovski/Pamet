name: Pamet v1.6.9 release prep

on:
  push:
    branches:
      - fix/pamet-v1.6.9-data-quality-layout
    paths:
      - .github/workflows/pamet-v1.6.9-release-prep.yml

permissions:
  contents: write

jobs:
  release-prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/pamet-v1.6.9-data-quality-layout
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Promote release identity
        shell: bash
        run: |
          set -euo pipefail
          npm version 1.6.9 --no-git-tag-version
          node <<'NODE'
          const fs = require('fs');
          const read = (path) => fs.readFileSync(path, 'utf8');
          const write = (path, text) => fs.writeFileSync(path, text);
          const replaceRequired = (text, from, to, label) => {
            if (!text.includes(from)) throw new Error(`Missing ${label || from}`);
            return text.replace(from, to);
          };

          let main = read('js/main.js');
          main = main.replaceAll('v1.6.8', 'v1.6.9');
          main = main.replaceAll("'1.6.8'", "'1.6.9'");
          main = replaceRequired(main, 'sw.js?v=1680', 'sw.js?v=1690', 'v1.6.8 service worker token');
          write('js/main.js', main);

          let cssMain = read('css/main.css');
          cssMain = replaceRequired(cssMain, 'Pamet v1.6.8', 'Pamet v1.6.9', 'CSS release comment');
          write('css/main.css', cssMain);

          let worker = read('sw.js');
          worker = worker.replaceAll('v1.6.8', 'v1.6.9').replaceAll('v168', 'v169');
          write('sw.js', worker);

          let index = read('index.html');
          index = index.replaceAll('v=168', 'v=169').replaceAll('Pamet v1.6.8', 'Pamet v1.6.9');
          write('index.html', index);

          const mobile = JSON.parse(read('contracts/mobile-api.json'));
          mobile.backendVersion = '1.6.9';
          write('contracts/mobile-api.json', `${JSON.stringify(mobile, null, 2)}\n`);

          let readme = read('README.md');
          readme = replaceRequired(readme, '**Version 1.6.8**', '**Version 1.6.9**', 'README current version');
          readme = replaceRequired(readme, '### Pamet 1.6.8', '### Pamet 1.6.9', 'README current release heading');
          write('README.md', readme);

          let versioning = read('VERSIONING.md');
          versioning = replaceRequired(versioning, 'current stable release line is `v1.6.8`', 'current stable release line is `v1.6.9`', 'stable release line');
          write('VERSIONING.md', versioning);

          let changelog = read('CHANGELOG.md');
          const section = `## [1.6.9] — 2026-09-04\n\n### Data Quality layout polish\n\n- Fixed the legacy flex-layout cascade that split the Data Quality summary into narrow columns.\n- Reworked the summary into one centered reading order with a clearer completeness headline and logging-consistency badge.\n- Improved spacing, typography, and responsive coverage-detail layout across desktop, Firefox, and mobile.\n- Added browser regression coverage for the one-column summary and 4 / 2 / 1-column detail grid.\n\n`;
          if (!changelog.includes('## [1.6.9]')) changelog = changelog.replace('# Pamet Change Log\n\n', `# Pamet Change Log\n\n${section}`);
          write('CHANGELOG.md', changelog);

          write('HOTFIX_STATUS.md', `# Pamet 1.6.9 Data Quality Layout Hotfix\n\nDate: 2026-09-04  \nBase release: **Pamet 1.6.8**  \nAssurance baseline: **Pamet 1.6.8**\n\n## Scope\n\nPamet 1.6.9 is a patch-only presentation fix for the Patterns / Data Quality card. It does not change the database schema, authentication model, billing behavior, server-side entitlement enforcement, encryption design, or dependency specifications reviewed for 1.6.8.\n\n## Fixes\n\n- Removes the legacy high-specificity flex rule from the Data Quality summary rendering path.\n- Presents Data Quality as one centered hierarchy rather than several narrow side-by-side text columns.\n- Keeps logging consistency separate from logged-entry completeness.\n- Uses responsive coverage details: four columns on wide desktop, two on tablet, and one on narrow mobile.\n- Adds Chromium, Firefox, and mobile regression coverage for computed layout, centering, and typography.\n\n## Release gate\n\nThe hotfix is not considered live until exact-head CI, merge, Wasmer deployment verification, production browser smoke, and admin parity are green.\n\n## Assurance note\n\nExisting external/provider assurance remains inherited from the 1.6.8 baseline. This patch does not claim that penetration, accessibility, legal/compliance, cryptographic, or provider assurance was independently rerun.\n`);

          for (const path of ['tests/e2e/plan-comparison.spec.js', 'tests/e2e/log-intelligence.spec.js']) {
            let text = read(path);
            text = text.replaceAll('1.6.8', '1.6.9');
            write(path, text);
          }
          NODE

          rm .github/workflows/pamet-v1.6.9-release-prep.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promote Pamet v1.6.9 release identity"
          git push origin HEAD:fix/pamet-v1.6.9-data-quality-layout