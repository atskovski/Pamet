name: Temporary OIDC claim diagnostic

on:
  push:
    branches: [fix/job-auth-oidc-acceptance]

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Print non-sensitive GitHub OIDC claims and verifier stage
        run: |
          set -euo pipefail
          OIDC_RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pamet-production-jobs")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$OIDC_TOKEN"
          export OIDC_TOKEN
          python3 - <<'PY'
          import os, json, base64
          token=os.environ['OIDC_TOKEN']
          payload=token.split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims=json.loads(base64.urlsafe_b64decode(payload).decode())
          keys=['iss','aud','repository','ref','event_name','workflow_ref','job_workflow_ref','sub','run_id']
          print(json.dumps({k:claims.get(k) for k in keys}, indent=2, sort_keys=True))
          PY
          node - <<'NODE'
          const { verifyGitHubActionsToken } = require('./lib/job-auth');
          verifyGitHubActionsToken(process.env.OIDC_TOKEN, {
            allowedWorkflows: ['oidc-claim-debug.yml'],
            allowedEvents: ['push']
          }).then((result) => {
            console.log(`verifier result: ok=${result.ok} reason=${result.reason || 'none'}`);
          }).catch((error) => {
            console.error(`verifier crashed: ${error.message}`);
            process.exit(1);
          });
          NODE
