name: Prepare Pamet 1.6.3 release

on:
  push:
    branches:
      - feature/care-sharing-workspace-v1.6.3

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/care-sharing-workspace-v1.6.3
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Refresh release metadata and acceptance docs
        run: |
          node <<'NODE'
          const fs = require('fs');
          function edit(path, fn) {
            const before = fs.readFileSync(path, 'utf8');
            const after = fn(before);
            if (after !== before) fs.writeFileSync(path, after);
          }
          edit('README.md', s => {
            s = s.replace('**Version 1.6.2**', '**Version 1.6.3**');
            const marker = '### Pamet 1.6.2';
            if (!s.includes('### Pamet 1.6.3')) {
              const section = `### Pamet 1.6.3\n\n- Rebuilds Caregiver access around a clear \"What will be included\" preview so users know exactly what they are sharing before they send it.\n- Keeps caregiver sharing intentionally limited to tracking overview, symptom summary, medications, and optional recent notes.\n- Expands Primary care access into the most detailed clinician-oriented Visit Brief, including full symptom history, medications, supported Pamet observations, recent sleep/stress/hydration/severity context, discussion prompts, and optional notes.\n- Adds an always-available local PDF fallback to both Caregiver access and Primary care access when secure email is unavailable or fails.\n- Corrects checkbox alignment and improves form spacing in sharing dialogs.\n- Gives Appointment Workspace a wider responsive desktop layout, earlier single-column breakpoint, and a dedicated confirmation row so \"Confirm this appointment date and time\" can never be covered by adjacent UI.\n- Rotates the PWA worker/cache/static asset identity to the 1.6.3 release so existing browsers receive these UI fixes.\n\n`;
              s = s.replace(marker, section + marker);
            }
            s = s.replace('Pamet 1.6.2 keeps the minimum compatible backend at 1.5.1', 'Pamet 1.6.3 keeps the minimum compatible backend at 1.5.1');
            return s;
          });
          edit('CHANGELOG.md', s => {
            if (!s.includes('## [1.6.3]')) {
              const marker = '## [1.6.2]';
              const section = `## [1.6.3] — 2026-09-03\n\n### Care sharing and appointment workspace\n- Added explicit caregiver and primary-care \"What will be included\" previews before sharing.\n- Kept caregiver output deliberately limited while making Primary care the richest clinician-oriented Visit Brief.\n- Added local print/save-to-PDF fallback buttons to both sharing flows, including when email delivery is unavailable or a send fails.\n- Fixed recent-notes checkbox alignment and sharing-dialog responsive spacing.\n- Reworked Appointment Workspace sizing and the date/time confirmation row to prevent overlap and clipped confirmation text.\n- Rotated service-worker and static-shell release tokens for reliable delivery of the UI patch.\n- Published backend/mobile contract identity 1.6.3 while retaining 1.5.1 as the minimum compatible native backend baseline.\n\n---\n\n`;
              s = s.replace(marker, section + marker);
            }
            return s;
          });
          edit('THREAT_MODEL.md', s => s.replace('Pamet v1.6.2', 'Pamet v1.6.3'));
          edit('GO_LIVE_STATUS.md', s => s.replace(/1\.6\.2/g, '1.6.3').replace(/v1620/g, 'v1630').replace(/v162-1/g, 'v163-1').replace(/v=162/g, 'v=163'));
          edit('PRODUCTION_READINESS.md', s => s.replace(/1\.6\.2/g, '1.6.3'));
          edit('REAL_ENVIRONMENT_ACCEPTANCE.md', s => s.replace(/1\.6\.2/g, '1.6.3').replace(/v1620/g, 'v1630').replace(/v162-1/g, 'v163-1').replace(/v=162/g, 'v=163'));
          edit('VERSIONING.md', s => s.replace('current stable release line is `v1.6.2`', 'current stable release line is `v1.6.3`'));
          edit('css/dark-mode.css', s => s.replace('/* Pamet v1.6.2', '/* Pamet v1.6.3'));
          edit('index.html', s => s.replace(/pamet\.min\.css\?v=162/g, 'pamet.min.css?v=163').replace(/pamet\.min\.js\?v=162/g, 'pamet.min.js?v=163').replace(/pamet-mark\.svg\?v=162/g, 'pamet-mark.svg?v=163'));
          NODE
      - name: Refresh lockfile and production bundles
        run: |
          npm install --ignore-scripts
          npm run build
      - name: Remove one-time release preparation workflow
        run: rm .github/workflows/prepare-release-v163.yml
      - name: Commit prepared release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Prepare Pamet 1.6.3 release metadata and bundles'
          git push origin HEAD:feature/care-sharing-workspace-v1.6.3
