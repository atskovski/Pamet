name: Pamet Live Acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pamet-live-acceptance
  cancel-in-progress: true

jobs:
  deployed-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Wait for and verify Wasmer production release
        env:
          PAMET_BASE_URL: https://pamet.wasmer.app
          PAMET_REQUIRE_OAUTH: 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            echo "Live acceptance attempt ${attempt}/6"
            if node scripts/check-live-environment.js; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 30
            fi
          done
          echo "Wasmer production did not converge to the repository release and required production dependencies."
          exit 1
