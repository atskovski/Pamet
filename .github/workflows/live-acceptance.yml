name: Pamet Live Acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pamet-live-acceptance
  cancel-in-progress: true

jobs:
  deployed-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build expected production bundles
        run: npm run build
      - name: Wait for and verify Wasmer production release
        env:
          PAMET_BASE_URL: https://pamet.wasmer.app
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            echo "Live acceptance attempt ${attempt}/6"
            if node scripts/check-live-assets.js && node scripts/check-live-environment.js; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 30
            fi
          done
          echo "Wasmer production did not converge to the exact repository build."
          exit 1

  browser-ui-smoke:
    name: Production browser UI smoke (Chromium + Firefox)
    needs: deployed-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      PAMET_UI_BASE_URL: https://pamet.wasmer.app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox
      - name: Verify deployed public UI and navigation
        run: npm run test:ui-smoke
      - name: Upload production browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pamet-production-ui-smoke-${{ github.run_id }}
          path: |
            playwright-report
            test-results/ui-integrity
          if-no-files-found: ignore
          retention-days: 14
