name: Refresh Pamet 1.3.0 artifacts

on:
  push:
    branches:
      - feature/pamet-v1.3.0-care-workspaces
    paths:
      - '.github/workflows/refresh-v130-artifacts.yml'
      - 'package.json'
      - 'js/**'
      - 'css/**'
      - 'sw.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-v130-artifacts
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pamet-v1.3.0-care-workspaces
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate lockfile and production bundles
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm run build
          node --check js/phase2.js
          node --check js/main.js
      - name: Commit generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json dist/pamet.min.js dist/pamet.min.css
          if git diff --cached --quiet; then
            echo 'Generated artifacts already current.'
            exit 0
          fi
          git commit -m 'build: refresh Pamet 1.3.0 lockfile and production bundles'
          git push origin HEAD:feature/pamet-v1.3.0-care-workspaces
