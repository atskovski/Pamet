name: Prepare Pamet v1.6.6

on:
  push:
    branches:
      - feature/pamet-v1.6.6-log-intelligence

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'Prepare Pamet v1.6.6 release metadata')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Promote release identity
        shell: bash
        run: |
          set -euo pipefail
          npm version 1.6.6 --no-git-tag-version
          node <<'NODE'
          const fs = require('fs');
          const version = '1.6.6';
          const token = '166';
          const read = (path) => fs.readFileSync(path, 'utf8');
          const write = (path, source) => fs.writeFileSync(path, source);
          const replaceRequired = (path, from, to, label) => {
            const source = read(path);
            if (!source.includes(from)) throw new Error(`${path}: missing ${label}`);
            write(path, source.replace(from, to));
          };

          let main = read('js/main.js')
            .replace('Pamet v1.6.5 production entrypoint', 'Pamet v1.6.6 production entrypoint')
            .replace("const PAMET_VERSION = '1.6.5';", "const PAMET_VERSION = '1.6.6';")
            .replace("navigator.serviceWorker.register('sw.js?v=1650'", "navigator.serviceWorker.register('sw.js?v=1660'");
          write('js/main.js', main);

          write('css/main.css', read('css/main.css').replace('Pamet v1.6.5 production stylesheet entrypoint', 'Pamet v1.6.6 production stylesheet entrypoint'));

          let worker = read('sw.js')
            .replace('Pamet v1.6.5 service worker', 'Pamet v1.6.6 service worker')
            .replace('pamet-shell-v165-5', 'pamet-shell-v166-1')
            .replaceAll('?v=165', '?v=166');
          write('sw.js', worker);

          let index = read('index.html').replaceAll('?v=165', '?v=166').replaceAll('Pamet v1.6.5', 'Pamet v1.6.6');
          write('index.html', index);

          const mobile = JSON.parse(read('contracts/mobile-api.json'));
          mobile.backendVersion = version;
          write('contracts/mobile-api.json', JSON.stringify(mobile, null, 2) + '\n');

          let readme = read('README.md');
          readme = readme.replace(/\*\*Version \d+\.\d+\.\d+\*\*/, `**Version ${version}**`);
          readme = readme.replace(/### Pamet \d+\.\d+\.\d+/, `### Pamet ${version}`);
          const currentMarker = `### Pamet ${version}\n`;
          const currentIndex = readme.indexOf(currentMarker);
          if (currentIndex >= 0) {
            const bodyStart = currentIndex + currentMarker.length;
            const history = readme.indexOf('\nRelease history belongs', bodyStart);
            if (history >= 0) {
              const summary = `\nThis release improves the daily logging experience and the quality of Pamet's observational history:\n\n- Free includes up to 3 custom symptoms, moods, and activities; Pro includes up to 10; Ultra is unlimited.\n- Pro and Ultra can add specific medication names, with Pro limited to 10 and Ultra unlimited.\n- Log a symptom now explains multi-select symptoms and symptom intensity in plain language.\n- Optional sleep quality, symptom-onset, and day-context fields add structured comparison points without turning the log into a long questionnaire.\n- Notes can be auto-summarized from the current log while remaining blank by default.\n- Pamet observations use unique-day aggregation, minimum sample sizes, effect thresholds, and explicitly observational/non-diagnostic language.\n- Home honors the Show Pamet observations setting and adds Bronze, Silver, Gold, Platinum, Diamond, and Beast logging milestones.\n- Home starter guidance now says WHAT PAMET WILL BUILD.\n`;
              readme = readme.slice(0, bodyStart) + summary + readme.slice(history);
            }
          }
          write('README.md', readme);

          let changelog = read('CHANGELOG.md');
          if (!changelog.includes(`## [${version}]`)) {
            const section = `# Pamet Change Log\n\n## [${version}] — 2026-09-04\n\n### Richer logging, observations, and milestones\n\n- Added plan-aware custom-field limits and upgrade guidance across symptoms, moods, activities, and medication names.\n- Clarified multi-select symptom logging and replaced ambiguous Overall severity wording with a plain-language symptom-intensity prompt.\n- Added optional structured context for sleep quality, symptom onset, and meaningful day factors.\n- Added Notes auto-summary while preserving a blank-by-default notes field and the existing freeform prompt.\n- Added a local descriptive analytics engine that aggregates by unique day, applies sample/effect safeguards, and keeps correlation language explicitly observational and non-diagnostic.\n- Made Home observations visibly honor the Settings toggle and added Bronze, Silver, Gold, Platinum, Diamond, and Beast logging milestones.\n- Updated Home starter guidance to WHAT PAMET WILL BUILD.\n- Added automated coverage for custom limits, milestones, entitlement gating, correlation language, and same-day aggregation.\n\n---\n\n`;
            changelog = changelog.replace('# Pamet Change Log\n\n', section);
          }
          write('CHANGELOG.md', changelog);

          let versioning = read('VERSIONING.md')
            .replace(/current stable release line is `v\d+\.\d+\.\d+`/, `current stable release line is \`v${version}\``)
            .replace(/Git tags and release titles use the `v` prefix \(`v\d+\.\d+\.\d+`\)/, `Git tags and release titles use the \`v\` prefix (\`v${version}\`)`);
          write('VERSIONING.md', versioning);

          let threat = read('THREAT_MODEL.md');
          if (!threat.includes(`v${version}`)) threat = threat.replace(/^(# .+\n)/, `$1\nCurrent reviewed application release: **v${version}**.\n`);
          write('THREAT_MODEL.md', threat);

          let goLive = read('GO_LIVE_STATUS.md');
          if (!goLive.includes(`Pamet ${version}`)) goLive = goLive.replace(/Pamet \d+\.\d+\.\d+/, `Pamet ${version}`);
          write('GO_LIVE_STATUS.md', goLive);

          let readiness = read('PRODUCTION_READINESS.md');
          readiness = readiness.replace(/Pamet v\d+\.\d+\.\d+ Production Readiness Review/, `Pamet v${version} Production Readiness Review`);
          write('PRODUCTION_READINESS.md', readiness);

          let acceptance = read('REAL_ENVIRONMENT_ACCEPTANCE.md');
          acceptance = acceptance.replace(/Expected repository release: \*\*\d+\.\d+\.\d+\*\*/, `Expected repository release: **${version}**`);
          write('REAL_ENVIRONMENT_ACCEPTANCE.md', acceptance);
          NODE

          rm .github/workflows/prepare-v166.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json js/main.js css/main.css sw.js index.html contracts/mobile-api.json README.md CHANGELOG.md VERSIONING.md THREAT_MODEL.md GO_LIVE_STATUS.md PRODUCTION_READINESS.md REAL_ENVIRONMENT_ACCEPTANCE.md .github/workflows/prepare-v166.yml
          git commit -m 'Bump Pamet release to v1.6.6'
          git push origin HEAD:feature/pamet-v1.6.6-log-intelligence
