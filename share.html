<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#0F3D3E"><title>Pamet — Shared health summary</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');:root{font-family:Inter,system-ui,sans-serif;color:#263638;background:#F4F5F2}*{box-sizing:border-box}body{margin:0;padding:28px 16px}.wrap{max-width:760px;margin:auto}.brand{display:flex;align-items:center;gap:10px;margin-bottom:24px;color:#0F3D3E;font-weight:700;font-size:22px}.brand img{width:38px;height:38px}.card{background:#fff;border:1px solid #DDE3DF;border-radius:14px;padding:22px;margin-bottom:14px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#5B6B73;font-weight:700}h1{font-size:28px;letter-spacing:-.6px;margin:6px 0 8px}h2{font-size:18px;margin:0 0 14px}.sub,.meta{color:#5B6B73;line-height:1.55}.meta{font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{border:1px solid #DDE3DF;border-radius:10px;padding:12px}.metric strong{display:block;font-size:13px}.metric span{display:block;color:#5B6B73;font-size:12px;margin-top:4px}.row{border-bottom:1px solid #EDF0ED;padding:9px 0}.notice{background:#EEF6FA;border:1px solid #CFE1EE;color:#284E64;border-radius:11px;padding:13px;line-height:1.55;font-size:13px;margin-bottom:14px}.error{background:#F7ECEF;border-color:#E4C8D0;color:#6D2E3D}.loading{text-align:center;color:#5B6B73;padding:48px 0}@media(max-width:560px){.grid{grid-template-columns:1fr}body{padding:18px 12px}}</style></head>
<body><main class="wrap"><div class="brand"><img src="assets/pamet-mark.svg" alt="">Pamet</div><div id="content" class="loading">Loading the shared summary…</div></main>
<script>(async()=>{const c=document.getElementById('content'),q=new URLSearchParams(location.search).get('token')||'',e=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));if(!q){c.className='notice error';c.textContent='This sharing link is missing or invalid.';return}try{const r=await fetch('/api/share/'+encodeURIComponent(q),{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error||'This sharing link is unavailable.');const s=d.snapshot||{},overview=Array.isArray(s.overview)?s.overview:[],symptoms=Array.isArray(s.symptoms)?s.symptoms:[],patterns=Array.isArray(s.patterns)?s.patterns:[],meds=Array.isArray(s.medications)?s.medications:[],notes=Array.isArray(s.notes)?s.notes:[];c.className='';c.innerHTML=`<section class="card"><div class="eyebrow">Shared health summary</div><h1>${e(d.ownerFirstName||'Pamet user')}'s Pamet summary</h1><p class="sub">${e(s.rangeLabel||'User-selected health history')}</p><p class="meta">Shared with ${e(d.recipientName||'a trusted person')}${d.organization?' · '+e(d.organization):''}. Link expires ${e(new Date(d.expiresAt).toLocaleDateString())}.</p></section><div class="notice">${e(s.disclaimer||'Generated from information recorded by the user. This is not a medical diagnosis or clinical assessment.')}</div>${overview.length?`<section class="card"><h2>Overview</h2><div class="grid">${overview.map(x=>`<div class="metric"><strong>${e(x[0])}</strong><span>${e(x[1])}</span></div>`).join('')}</div></section>`:''}${symptoms.length?`<section class="card"><h2>Symptoms</h2>${symptoms.map(x=>`<div class="row"><strong>${e(x[0])}</strong><div class="meta">${e(x[1])}</div></div>`).join('')}</section>`:''}${patterns.length?`<section class="card"><h2>Observed patterns</h2>${patterns.map(x=>`<div class="row"><strong>${e(x.title)}</strong><div class="meta">${e(x.detail)}</div></div>`).join('')}</section>`:''}${meds.length?`<section class="card"><h2>Medications recorded</h2>${meds.map(x=>`<div class="row"><strong>${e(x[0])}</strong><div class="meta">${e(x[1])}</div></div>`).join('')}</section>`:''}${notes.length?`<section class="card"><h2>Recent notes</h2>${notes.map(x=>`<div class="row"><strong>${e(x.date)}</strong><div class="meta">${e(x.notes)}</div></div>`).join('')}</section>`:''}<p class="meta">Pamet supports care coordination, not continuous monitoring. This page is not an emergency-response service.</p>`}catch(x){c.className='notice error';c.textContent=x.message||'This sharing link is unavailable.'}})();</script></body></html>
